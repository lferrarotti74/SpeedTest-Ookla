jobs:
  sync-main-to-dev:
    uses: lferrarotti74/github-workflows-templates/.github/workflows/sync-main-to-dev.yml@9e24159d0cbb549461b4e113aced93915096a490
    with:
      source_branch: main
      target_branch: dev
