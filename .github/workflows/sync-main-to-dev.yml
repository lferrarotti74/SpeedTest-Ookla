name: Sync Main to Dev

on:
  push:
    branches:
      - main

permissions:
  contents: write  # needed for pushing commits

jobs:
  sync-main-to-dev:
    uses: lferrarotti74/github-workflows-templates/.github/workflows/sync-main-to-dev.yml@c73ef23d58df103c14f5d3d209c35e9d83b58d8d
    with:
      source_branch: main
      target_branch: dev
