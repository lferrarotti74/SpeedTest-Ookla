      - main

permissions:
  contents: write  # needed for pushing commits

jobs:
  sync-main-to-dev:
    uses: lferrarotti74/github-workflows-templates/.github/workflows/sync-main-to-dev.yml@d13a7dfdb9259e6083002c31d0c331617150b20f
    with:
      source_branch: main
      target_branch: dev
