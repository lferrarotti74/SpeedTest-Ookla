    branches:
      - main

permissions:
  contents: write  # needed for pushing commits

jobs:
  sync-main-to-dev:
    uses: lferrarotti74/github-workflows-templates/.github/workflows/sync-main-to-dev.yml@51d1d177cfa5135d710c258a4873655da5ea120f
    with:
      source_branch: main
      target_branch: dev
