    branches:
      - main

permissions:
  contents: write  # needed for pushing commits

jobs:
  sync-main-to-dev:
    uses: lferrarotti74/github-workflows-templates/.github/workflows/sync-main-to-dev.yml@4dd2847d7242f058b015819a4a3205a959a54efa
    with:
      source_branch: main
      target_branch: dev
