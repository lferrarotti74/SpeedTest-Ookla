    branches:
      - main

permissions:
  contents: write  # needed for pushing commits

jobs:
  sync-main-to-dev:
    uses: lferrarotti74/github-workflows-templates/.github/workflows/sync-main-to-dev.yml@c1a8e4515c684a38e80f65083834de28c07ce094
    with:
      source_branch: main
      target_branch: dev
