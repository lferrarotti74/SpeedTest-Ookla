jobs:
  sync-main-to-dev:
    uses: lferrarotti74/github-workflows-templates/.github/workflows/sync-main-to-dev.yml@f75177559730a570250f69b4740cad91cba38ccc
    with:
      source_branch: main
      target_branch: dev
