name: Sync Main to Dev

on:
  push:
    branches:
      - main

permissions:
  contents: write  # needed for pushing commits

jobs:
  sync-main-to-dev:
    uses: lferrarotti74/github-workflows-templates/.github/workflows/sync-main-to-dev.yml@3c28cbe6e7f1876437242e86c776c2a46d96f0bd
    with:
      source_branch: main
      target_branch: dev
